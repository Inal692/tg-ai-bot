---
blueprintName: tg-ai-bot

services:
  - type: worker
    name: tg-ai-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: false
    envVars:
      - key: TG_BOT_TOKEN
        sync: false  # будет введён вручную в дашборде
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: MAX_HISTORY
        value: "20"
