name: tg-ai-bot
service:
  name: bot
  instance_type: nano
  docker:
    dockerfile: Dockerfile
    context: .
  ports:
    - port: 8080
      protocol: http
  env:
    - key: GEMINI_MODEL
      value: gemini-3.5-flash
    - key: MAX_HISTORY
      value: "20"
  secrets:
    - name: TG_BOT_TOKEN
    - name: GEMINI_API_KEY
